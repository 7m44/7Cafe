<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#2E1065" />
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="2.5" />
  <text x="32" y="42" font-family="'Segoe UI Black', Inter, system-ui, sans-serif" font-weight="900" font-size="28" fill="#A855F7" text-anchor="middle" filter="url(#neonGlow)">7C</text>
  <text x="32" y="42" font-family="'Segoe UI Black', Inter, system-ui, sans-serif" font-weight="900" font-size="28" fill="#F8FAFC" text-anchor="middle">7C</text>
</svg>
